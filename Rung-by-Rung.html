<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rung by Rung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a controller console. Mission and live intersection on the left, the ladder rack on the right.
   Power flow (teal) is the only decorative color; red/amber/green belong to the lamps. */
:root {
  --bg: #E9EEEE; --surface: #F8FAFA; --surface2: #EEF3F3; --ink: #14202A; --ink2: #51636F; --line: #C8D3D6;
  --power: #0A8F86; --power-ink: #06524D; --power-bg: #D5F0EC; --rail: #14202A;
  --ok: #1B7A3C; --bad: #B42318; --warn: #A15C07; --focus: #0A5FD6;
  --ground: #DCE5E1; --asphalt: #46535D; --paint: #E7EDEF; --lamp-off: #2B353C; --housing: #171F25;
  --lamp-red: #F0452F; --lamp-yellow: #F7BE1F; --lamp-green: #2FC262; --lamp-blue: #4DA3FF; --lamp-white: #F1F6F8;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif; --f-head: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif; --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1317; --surface: #141C22; --surface2: #1A242B; --ink: #E5EDF1; --ink2: #93A5B1; --line: #28363F;
  --power: #3FE0CF; --power-ink: #8CF0E5; --power-bg: #12373A; --rail: #7C909C;
  --ok: #4CD27C; --bad: #FF7A6B; --warn: #F2B24D; --focus: #7DB4FF;
  --ground: #10181C; --asphalt: #2A353D; --paint: #C9D5DB; --lamp-off: #232D34; --housing: #0A0F12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1317; --surface: #141C22; --surface2: #1A242B; --ink: #E5EDF1; --ink2: #93A5B1; --line: #28363F;
  --power: #3FE0CF; --power-ink: #8CF0E5; --power-bg: #12373A; --rail: #7C909C;
  --ok: #4CD27C; --bad: #FF7A6B; --warn: #F2B24D; --focus: #7DB4FF;
  --ground: #10181C; --asphalt: #2A353D; --paint: #C9D5DB; --lamp-off: #232D34; --housing: #0A0F12; color-scheme: dark; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px 12px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand svg { color: var(--power); flex: none; }
.brand h1 { font: 700 24px/1 var(--f-head); letter-spacing: .01em; margin: 0; }
.brand p { margin: 2px 0 0; color: var(--ink2); font-size: 12.5px; }
.levels { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px 6px; font: 600 12.5px/1.2 var(--f-head); letter-spacing: .03em; text-transform: uppercase; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--power); color: var(--ink); }
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .tick { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 9px; opacity: .55; }
.chip.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; opacity: 1; }
.layout { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font: 700 13px/1 var(--f-head); text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); margin: 0 0 10px; }
.kicker { font: 600 12px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--power-ink); }
.mission h3 { font: 700 26px/1.1 var(--f-head); margin: 6px 0 10px; text-wrap: balance; }
.mission p { margin: 0 0 10px; max-width: 65ch; }
.goal { background: var(--surface2); border-left: 3px solid var(--power); padding: 10px 12px; border-radius: 0 6px 6px 0; font-weight: 500; }
.goal small { display: block; font: 600 11px/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); margin-bottom: 5px; }
.coach { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.coach li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; padding: 7px 8px; border-radius: 6px; background: var(--surface2); }
.coach li i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 10px; font-style: normal; color: #fff; margin-top: 1px; }
.coach li.done i { background: var(--ok); border-color: var(--ok); }
.coach li.done { opacity: .72; }
details.hints { margin-top: 12px; }
details summary { cursor: pointer; font-weight: 600; color: var(--ink2); }
details ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink2); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--power-ink); text-decoration: underline; font-weight: 500; }
.sceneCard canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 6px; background: var(--ground); }
.sim { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--power); }
.btn.primary { background: var(--power); border-color: var(--power); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .btn.primary { color: #04201D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #04201D; } }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.clock { font: 500 13px var(--f-mono); color: var(--ink2); margin-left: auto; font-variant-numeric: tabular-nums; }
.speed { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.speed button { border: 0; background: var(--surface); padding: 5px 9px; font: 500 12.5px var(--f-mono); }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.inputs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.inputs:empty { display: none; }
.inp { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 8px 12px; font-weight: 600; user-select: none; touch-action: none; }
.inp .led { width: 12px; height: 12px; border-radius: 50%; background: var(--lamp-off); }
.inp small { font: 500 11px var(--f-mono); color: var(--ink2); display: block; font-weight: 400; }
.inp.on { border-color: var(--power); background: var(--power-bg); }
.inp.on .led { background: var(--power); box-shadow: 0 0 8px var(--power); }
.scope canvas { width: 100%; display: block; }
.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; margin-top: 12px; font: 12px var(--f-mono); }
.tg { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tg i { width: 9px; height: 9px; border-radius: 50%; background: var(--lamp-off); flex: none; }
.tg.on i { background: var(--power); box-shadow: 0 0 6px var(--power); }
.tg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tg em { font-style: normal; color: var(--ink2); margin-left: auto; font-variant-numeric: tabular-nums; }
/* editor */
.edhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.edhead h2 { margin: 0 auto 0 0; }
.insp { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; min-height: 46px; }
.insp .hint { color: var(--ink2); }
.insp label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink2); }
.insp select, .insp input[type=number] { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 6px; font: 13px var(--f-mono); max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; font: 500 12.5px var(--f-mono); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ladder { display: grid; gap: 10px; }
.rungWrap { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.rungHead { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-bottom: 1px solid var(--line); font: 600 11.5px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.rungHead .sp { margin-right: auto; }
.rungHead .btn { padding: 1px 7px; font-size: 12px; text-transform: none; letter-spacing: 0; font-family: var(--f-body); }
.rung { display: flex; align-items: stretch; overflow-x: auto; padding: 4px 0; }
.rail { width: 6px; flex: none; background: var(--rail); border-radius: 3px; margin: 0 4px; }
.rail.on { background: var(--power); }
.rb { display: flex; align-items: flex-start; flex: 1 0 auto; min-width: 0; }
.grp { display: flex; flex-direction: column; }
.grp.multi { border-left: 2px solid var(--power); border-right: 2px solid var(--line); }
.grp.multi.out { border-right-color: var(--power); }
.row { display: flex; align-items: flex-start; flex: 1; }
.wire { height: 2px; background: var(--line); margin-top: 33px; min-width: 14px; flex: 1; }
.wire.on { background: var(--power); }
.cell { position: relative; flex: none; width: 88px; height: 68px; border: 0; background: none; padding: 0; text-align: center; color: var(--ink2); border-radius: 6px; }
.cell::before, .cell::after { content: ""; position: absolute; top: 33px; height: 2px; width: 24px; background: var(--line); }
.cell::before { left: 0; width: 36px; } .cell::after { right: 0; width: 36px; }
.cell.box::before, .cell.box::after { width: 25px; }
.cell.inP::before, .cell.pass::after { background: var(--power); }
.cell .tg2 { position: absolute; left: 0; right: 0; top: 1px; font: 500 11px/14px var(--f-mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.cell .sub { position: absolute; left: 0; right: 0; bottom: 1px; font: 500 10.5px/12px var(--f-mono); color: var(--ink2); }
.cell svg { position: absolute; left: 24px; top: 17px; width: 40px; height: 32px; overflow: visible; }
.cell svg * { stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cell svg text { fill: currentColor; stroke: none; font: 700 11px var(--f-mono); }
.cell.pass svg { color: var(--power); filter: drop-shadow(0 0 3px var(--power)); }
.cell.pass .sub { color: var(--power-ink); }
.cell:hover { background: var(--surface2); }
.cell.sel { outline: 2px solid var(--focus); background: var(--surface2); }
.cell.bad .tg2 { color: var(--bad); }
.addw { position: relative; display: flex; align-items: flex-start; flex: none; }
.add { width: 26px; height: 26px; margin: 21px 6px 0; border-radius: 50%; border: 1.5px dashed var(--ink2); background: var(--surface); color: var(--ink2); font: 600 16px/1 var(--f-body); padding: 0; display: grid; place-items: center; }
.add:hover { border-color: var(--power); color: var(--power); border-style: solid; }
.xrow { width: 22px; height: 22px; margin: 23px 2px 0 0; padding: 0; border: 0; background: none; color: var(--ink2); font-size: 15px; border-radius: 4px; flex: none; }
.xrow:hover { color: var(--bad); }
.menu { position: absolute; z-index: 20; top: 50px; left: 0; background: var(--surface); border: 1px solid var(--ink2); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); padding: 4px; min-width: 200px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; }
.menu button:hover { background: var(--power-bg); }
.menu small { display: block; color: var(--ink2); font-size: 11.5px; }
.res { display: grid; gap: 10px; }
.resHead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.resHead h2 { margin: 0 auto 0 0; }
.sc { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.sc.pass { border-color: var(--ok); }
.sc h4 { margin: 0; font: 700 14px var(--f-head); letter-spacing: .02em; display: flex; gap: 8px; align-items: center; }
.sc p { margin: 2px 0 6px; color: var(--ink2); font-size: 12.5px; }
.sc ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; }
.sc li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; font-size: 13px; }
.sc li b { font-weight: 700; }
.sc li.ok b { color: var(--ok); } .sc li.no b { color: var(--bad); }
.sc li .why { display: block; color: var(--bad); font-size: 12.5px; }
.sc li .tip { display: block; color: var(--ink2); font-size: 12.5px; margin-top: 2px; }
.share textarea { width: 100%; min-height: 150px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 6px; padding: 8px; font: 12px/1.45 var(--f-mono); resize: vertical; }
.share { margin-top: 4px; }
.rev { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
.rev h3 { font: 700 22px var(--f-head); margin: 0 0 4px; }
.rev pre { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12px/1.5 var(--f-mono); margin: 6px 0; }
.rev h5 { font: 700 12px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 12px 0 2px; }
.rev ul { margin: 4px 0; padding-left: 18px; }
.toplinks { display: flex; gap: 12px; }
.rev a { color: var(--power-ink); }
.banner { border-radius: 8px; padding: 12px 14px; background: var(--power-bg); border: 1px solid var(--power); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.banner b { font: 700 16px var(--f-head); }
.banner .sp { margin-right: auto; }
.stale { color: var(--ink2); font-size: 12.5px; }
.sol { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--ink2); font-size: 12.5px; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 14px; margin-bottom: 12px; font-size: 12px; color: var(--ink2); }
.legend div { display: flex; gap: 8px; align-items: center; }
.legend svg { width: 34px; height: 24px; flex: none; color: var(--ink); }
.legend svg * { stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.legend svg text { fill: currentColor; stroke: none; font: 700 9px var(--f-mono); }
@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .col { display: contents; }
  #cMission { order: 1; } #cScene { order: 2; } #cEditor { order: 3; } #cRes { order: 4; } #cScope { order: 5; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 3v28M28 3v28M6 10h6m10 0h6M6 17h4m4 0h4m4 0h6M6 24h14m4 0h4"/><circle cx="23" cy="10" r="1.6" fill="currentColor"/></svg>
      <div><h1>Rung by Rung</h1><p>Learn PLC ladder logic by running a traffic light</p></div>
    </div>
    <nav class="levels" id="levels" aria-label="Rounds"></nav>
    <a class="toplinks" href="#review" style="color:var(--power-ink);font-weight:500;font-size:13px">Reviewer sheet</a>
  </header>
  <div id="reviewView" hidden></div>
  <div class="layout">
    <div class="col">
      <article class="card mission" id="cMission"></article>
      <article class="card sceneCard" id="cScene">
        <canvas id="scene" width="480" height="480" aria-label="Live simulation"></canvas>
        <div class="sim">
          <button class="btn" id="bPlay">Pause</button>
          <button class="btn" id="bReset">Reset</button>
          <span class="speed" role="group" aria-label="Speed"><button data-s="1" aria-pressed="true">1×</button><button data-s="3" aria-pressed="false">3×</button><button data-s="8" aria-pressed="false">8×</button></span>
          <span class="clock" id="clock">0.0 s</span>
        </div>
        <div class="inputs" id="inputs"></div>
      </article>
      <article class="card scope" id="cScope"><h2>Timing chart and tags</h2><canvas id="scope" height="150"></canvas><div class="tags" id="tags"></div></article>
    </div>
    <div class="col">
      <article class="card" id="cEditor">
        <div class="edhead"><h2>Ladder</h2>
          <button class="btn sm" id="bUndo">Undo</button>
          <button class="btn sm" id="bRung">+ Rung</button>
          <button class="btn sm" id="bClear">Clear</button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="insp" id="insp"></div>
        <div class="ladder" id="ladder"></div>
      </article>
      <article class="card res" id="cRes"></article>
    </div>
  </div>
</div>
</div><script>
/* ---------- Ladder engine: scan-cycle simulator ---------- */
const TICK = 0.1; // seconds per PLC scan
const clone = o => JSON.parse(JSON.stringify(o));
const emptyRung = () => ({ rows: [[]], tail: [], out: null });

function readTag(s, tag) {
  if (tag && tag.endsWith('.DN')) { const t = s.timers[tag.slice(0, -3)]; return !!(t && t.dn); }
  return !!s.tags[tag];
}
function evalEl(s, el) { if (!el.tag) return false; const v = readTag(s, el.tag); return el.t === 'NC' ? !v : v; }
function makeSim(prog) { return { prog, tags: {}, timers: {}, tick: 0, info: [] }; }

function scan(s) {
  const info = [];
  s.prog.rungs.forEach(r => {
    const ri = { rows: [], tail: [], gOut: true, power: false };
    let any = false, g = false;
    r.rows.forEach(row => {
      let p = true; const cells = [];
      row.forEach(el => { const c = evalEl(s, el); cells.push({ inP: p, pass: p && c }); p = p && c; });
      ri.rows.push({ cells, out: p, empty: row.length === 0 });
      if (row.length) { any = true; if (p) g = true; }
    });
    if (!any) g = true;
    ri.gOut = g;
    let p = g;
    r.tail.forEach(el => { const c = evalEl(s, el); ri.tail.push({ inP: p, pass: p && c }); p = p && c; });
    ri.power = p;
    const o = r.out;
    if (o && o.tag) {
      if (o.t === 'COIL') s.tags[o.tag] = p;
      else if (o.t === 'TON') {
        const t = s.timers[o.tag] || (s.timers[o.tag] = { acc: 0, dn: false, pre: 0 });
        t.pre = o.preset;
        if (p) { if (t.acc < o.preset) t.acc++; t.dn = t.acc >= o.preset; } else { t.acc = 0; t.dn = false; }
      }
    }
    info.push(ri);
  });
  s.info = info; s.tick++;
}

/* ---------- Headless scenarios and checks ---------- */
let TAGNAME = {};
const nm = k => TAGNAME[k] || k;
const press = (tag, t, dur) => [{ t, tag, v: true }, { t: t + dur, tag, v: false }];
const hold = (tag, t0, t1) => press(tag, t0, t1 - t0);

function runScenario(prog, scen) {
  const s = makeSim(prog), trace = [], n = Math.round(scen.duration / TICK);
  const ev = (scen.events || []).map(e => ({ k: Math.round(e.t / TICK), tag: e.tag, v: e.v }));
  for (let k = 1; k <= n; k++) {
    ev.forEach(e => { if (e.k === k - 1) s.tags[e.tag] = e.v; });
    scan(s);
    trace.push({ t: +(k * TICK).toFixed(1), v: Object.assign({}, s.tags) });
  }
  return trace;
}
const onoff = v => v ? 'ON' : 'OFF';
function win(t0, t1, exp, label, hint) {
  return { label, hint, run(tr) {
    for (const f of tr) {
      if (f.t < t0 - 1e-9 || f.t > t1 + 1e-9) continue;
      for (const k in exp) if (!!f.v[k] !== !!exp[k])
        return { ok: false, msg: `At ${f.t.toFixed(1)} s, ${nm(k)} was ${onoff(f.v[k])} but should be ${onoff(exp[k])}.` };
    }
    return { ok: true };
  } };
}
function never(fn, label, why) {
  return { label, run(tr) {
    for (const f of tr) if (fn(f.v)) return { ok: false, msg: `At ${f.t.toFixed(1)} s: ${why}` };
    return { ok: true };
  } };
}
function oneOf(tags, label, from) {
  return { label, run(tr) {
    let bad = 0;
    for (const f of tr) {
      if (f.t < (from || 0.2)) continue;
      const c = tags.filter(k => f.v[k]).length;

  level = LEVELS.find(l => l.id === id) || LEVELS[0];
  LABEL = {}; level.outputs.concat(level.inputs, level.bitsInfo || []).forEach(o => LABEL[o.tag] = o.label); TAGNAME = LABEL;
  let saved = null; try { saved = JSON.parse(LS.get('rbr.prog.' + level.id)); } catch (e) { }
  if (!saved || !Array.isArray(saved) || !saved.length) {
    if (level.startFrom) { try { saved = JSON.parse(LS.get('rbr.prog.' + level.startFrom)); } catch (e) { } if (!saved || !saved.length) saved = clone(SOL[level.startFrom]); }
    else saved = [emptyRung()];
  }
  prog = { rungs: saved }; normalize();
  sel = null; undoStack = []; results = null; stale = false; solConfirm = false; inputs = {};
  scopeKeys = level.inputs.map(i => i.tag).concat(level.outputs.map(o => o.tag));
  Scene.reset(); rebuildSim();
  LS.set('rbr.last', level.id);
  if (!fromHash) { try { history.replaceState(null, '', '#' + level.id); } catch (e) { } }
  renderNav(); renderMission(); renderLegend(); renderInputs(); renderLadder(); renderInsp(); renderTagList(); renderResults(); updateCoach(true);
  window.scrollTo({ top: 0 });
}
function boot() {
  wireEditor();
  $('#levels').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) openLevel(b.dataset.id); });
  $('#bPlay').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
  $('#bReset').onclick = () => { Scene.reset(); rebuildSim(); };
  document.querySelectorAll('.speed button').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  addEventListener('hashchange', () => { showView(); const id = location.hash.slice(1); if (LEVELS.some(l => l.id === id) && id !== level.id) openLevel(id, true); });
  const h = location.hash.slice(1), last = LS.get('rbr.last');
  openLevel(LEVELS.some(l => l.id === h) ? h : LEVELS.some(l => l.id === last) ? last : 't1', true);
  showView(); requestAnimationFrame(frame);
}
boot();

/* ---------- text export and reviewer sheet ---------- */
function ladderText(rungs) {
  const el = e => e.t === 'NO' ? `XIC ${e.tag || '?'}` : e.t === 'NC' ? `XIO ${e.tag || '?'}` : e.t === 'COIL' ? `OTE ${e.tag || '?'}` : `TON ${e.tag || '?'} preset ${(e.preset / 10).toFixed(1)}s`;
  return rungs.map((r, i) => {
    const rows = r.rows.filter(x => x.length).map(x => x.map(el).join('  ->  '));
    let t = `Rung ${i + 1}:  `;
    if (rows.length > 1) t += '[ ' + rows.map(x => '( ' + x + ' )').join('  OR  ') + ' ]'; else t += rows[0] || '(always on)';
    if (r.tail.length) t += '  ->  ' + r.tail.map(el).join('  ->  ');
    return t + '  ->  ' + (r.out ? el(r.out) : '(no output)');
  }).join('\n');
}
function shareText() {
  const sc = level.scenarios.map(s => `  - ${s.name}: ${s.desc || ''}`).join('\n');
  return `Rung by Rung: ${level.label}, ${level.title}\nGoal: ${level.goal.replace(/<[^>]+>/g, '')}\nTests:\n${sc}\n\nMy ladder (XIC = normally open, XIO = normally closed, OTE = coil, TON = on-delay timer):\n${ladderText(prog.rungs)}\n\nLast result: ${results ? (results.every(r => r.ok) ? 'all checks pass' : results.flatMap(r => r.checks.filter(c => !c.ok).map(c => `${r.name} / ${c.label}: ${c.msg}`)).join('\n  ')) : 'tests not run yet'}`;
}
function renderShare() {
  const box = $('#shareBox'); if (!box) return;
  box.innerHTML = `<details class="share"><summary>Share this ladder with an expert</summary><p class="stale">Copy this text into an email or chat. It has the goal, the tests and your ladder in standard mnemonics. For the whole course, send them the page link with <b>#review</b> on the end.</p><textarea readonly id="shareTxt" aria-label="Ladder as text"></textarea><div style="margin-top:6px"><button class="btn sm" id="bCopy">Copy text</button> <span class="stale" id="copyMsg"></span></div></details>`;
  const d = box.querySelector('details'), ta = $('#shareTxt'); d.addEventListener('toggle', () => { ta.value = shareText(); });
  $('#bCopy').onclick = () => { ta.value = shareText(); ta.select(); let ok = false; try { navigator.clipboard.writeText(ta.value).then(() => { $('#copyMsg').textContent = 'Copied.'; }, () => { $('#copyMsg').textContent = 'Select the text and copy it.'; }); ok = true; } catch (e) { } if (!ok) $('#copyMsg').textContent = 'Select the text and copy it.'; };
}
function renderReview() {
  const strip = h => h.replace(/<[^>]+>/g, '');
  let h = `<div class="rev"><div class="card"><h3>Reviewer sheet</h3><p>For anyone checking the course for technical accuracy. Every round lists its goal, its tests and the reference solution in standard ladder mnemonics. <a href="#t1" id="backGame">Back to the game</a></p>
  <h5>How the simulator works</h5><ul><li>Scan cycle of 100 ms. Rungs run top to bottom, and a coil or timer written in a rung is visible to later rungs in the same scan.</li><li>Inputs are applied at the start of each scan. Outputs are just tags the ladder writes.</li><li>TON: accumulates one tick per scan while its rung is true, sets .DN when it reaches the preset, and resets to zero and clears .DN when the rung goes false.</li><li>A rung is a group of parallel rows (OR), each row a series of contacts (AND), then optional series contacts, then one output. A rung with no contacts is always true.</li><li>Simplifications: the STOP button reads true when pressed and is examined with an NC contact (real stop buttons are usually wired the other way for fail-safety). No retentive timers, latch/unlatch or counters.</li><li>A tested window starts and ends 0.3 to 0.4 s inside each phase, so one or two scans of timing drift are accepted.</li></ul></div>`;
  LEVELS.forEach(L => {
    h += `<div class="card"><div class="kicker">${esc(L.label)}</div><h3>${esc(L.title)}</h3><p>${strip(L.brief)}</p><div class="goal"><small>Goal</small>${strip(L.goal)}</div>
    <h5>Tags</h5><p class="stale">Inputs: ${L.inputs.map(i => `${i.tag} (${i.kind === 'push' ? 'momentary' : 'maintained'})`).join(', ') || 'none'}<br>Outputs: ${L.outputs.map(o => o.tag).join(', ')}${L.bits.length ? '<br>Memory bits: ' + L.bits.join(', ') : ''}</p>
    <h5>Tests</h5>` + L.scenarios.map(s => `<p style="margin:4px 0"><b>${esc(s.name)}</b> <span class="stale">${esc(s.desc || '')}</span></p><ul>${s.checks.map(c => `<li>${esc(c.label)}</li>`).join('')}</ul>`).join('') +
    `<h5>Reference solution (${L.solution.length} rung${L.solution.length === 1 ? '' : 's'})</h5><pre>${esc(ladderText(L.solution))}</pre></div>`;
  });
  $('#reviewView').innerHTML = h + '</div>';
}
function showView() {
  const rv = location.hash.slice(1) === 'review';
  $('#reviewView').hidden = !rv; $('.layout').hidden = rv; $('#levels').hidden = rv;
  if (rv) { renderReview(); window.scrollTo({ top: 0 }); }
}
</script>
