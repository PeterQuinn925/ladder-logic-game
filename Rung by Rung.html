<style>
/* Layout concept: a controller console. Mission and live intersection on the left, the ladder rack on the right.

/* ---------- Ladder engine: scan-cycle simulator ---------- */
const TICK = 0.1; // seconds per PLC scan
const clone = o => JSON.parse(JSON.stringify(o));
const emptyRung = () => ({ rows: [[]], tail: [], out: null, more: [] });   // out = main output, more = extra output branches
const allOuts = r => [r.out].concat(r.more || []).filter(Boolean);

function readTag(s, tag) {
  if (tag && tag.endsWith('.DN')) { const t = s.timers[tag.slice(0, -3)]; return !!(t && t.dn); }
  return !!s.tags[tag];
}
function evalEl(s, el) {
  if (!el.tag) return false;
  if (el.t === 'LES' || el.t === 'GEQ' || el.t === 'LIM') {          // compare a timer's running value (.ACC, in tenths of a second)
    const t = s.timers[el.tag], a = t ? t.acc : 0;
    return el.t === 'LES' ? a < el.val : el.t === 'GEQ' ? a >= el.val : (a >= el.lo && a < el.hi);
  }
  const v = readTag(s, el.tag); return el.t === 'NC' ? !v : v;
}
function makeSim(prog) { return { prog, tags: {}, timers: {}, tick: 0, info: [] }; }

function scan(s) {
  const info = [];
  s.tags.CLK_1HZ = (s.tick % 10) < 5;   // system clock bits: 0.5 s on / 0.5 s off
  s.tags.CLK_FAST = (s.tick % 4) < 2;   // 0.2 s on / 0.2 s off
  s.prog.rungs.forEach(r => {
    const ri = { rows: [], tail: [], gOut: true, power: false };
    let any = false, g = false;
    r.rows.forEach(row => {
      let p = true; const cells = [];
      row.forEach(el => { const c = evalEl(s, el); cells.push({ inP: p, pass: p && c }); p = p && c; });
      ri.rows.push({ cells, out: p, empty: row.length === 0 });

        return { ok: false, msg: `At ${f.t.toFixed(1)} s, ${nm(k)} was ${onoff(f.v[k])} but should be ${onoff(exp[k])}.` };

  t8: { title: 'Timers: on-delay (TON)', expr: 'BEACON = RUN for 3 s', example: SOL.t8,
    body: 'A <b>TON</b> counts up while its rung has power. When it reaches the preset its <b>.DN</b> (done) bit turns on, and you use that bit as a contact elsewhere. If the rung loses power the timer snaps back to zero. The running value is called <b>.ACC</b>.<br><br><b>How a tag turns a contact on.</b> A tag is just a named true/false memory cell (or a number, for .ACC). Nothing is wired between a coil and a contact. They only share a name. Each scan the PLC does this: (1) the TON rung has power, so the timer counts; (2) when the count reaches the preset the PLC writes 1 into the cell named <b>T1.DN</b>; (3) a normally open contact named <b>T1.DN</b> reads that same cell, so it now passes power; (4) the BEACON coil on that rung turns on. A contact is a <i>question</i> (&quot;is this cell 1?&quot;) and a coil or timer is an <i>answer</i> (&quot;write this cell&quot;). Any number of contacts can ask about the same tag, but only one coil should write it.' },

{ id: 't5', group: 'Tutorial', label: 'Level 5', title: 'Seal-in: a circuit that remembers', kind: 'bench', startFrom: 't1', noOutBranch: true, concept: CONCEPT.t5,
  brief: 'A motor start station uses one button to start and one to stop. The START button is only pressed for a moment, so the circuit must remember. Your rung from Level 1 is here to build on.',
  goal: 'START turns the LAMP on and it stays on. STOP turns it off, even if START is held at the same time.',
  inputs: [I.START, I.STOP], outputs: [{ tag: 'LAMP', label: 'Lamp', color: 'yellow' }], bits: [], timers: 0, palette: ['NO', 'NC', 'COIL'],
  coach: [
    { text: 'Press <b>\u2442 Branch</b> and put a contact tagged <b>LAMP</b> in the new row. The lamp now feeds itself.', done: p => p.some(r => r.rows.length > 1 && r.rows.some(w => w.some(e => e.tag === 'LAMP'))) },
    { text: 'Use the <b>+</b> right after the branch block to add a <b>Normally Closed</b> contact on <b>STOP</b>. It must break both paths.', done: p => p.some(r => r.tail.some(e => e.t === 'NC' && e.tag === 'STOP')) },
    { text: 'Press START briefly on the bench. The lamp stays on. Press STOP to release it.', done: (p, live) => !!(live && live.tags.LAMP && !live.tags.START) }],
  hints: ['If STOP sits inside one branch row, the other row still keeps the lamp on. Put it after the branch.', 'Rows are OR. Anything placed after the branch block is AND with the whole block.'],
  scenarios: [{ name: 'Latch, stop, latch again', desc: 'START at 1 s, STOP at 5 s, START at 9 s, then START and STOP together at 12 s', duration: 15,
    events: [].concat(press('START', 1, 0.5), press('STOP', 5, 0.5), press('START', 9, 0.5), hold('START', 12, 14), hold('STOP', 12, 14)),
    checks: [win(0.2, 0.9, { LAMP: 0 }, 'Off at power-up'), win(2, 4.8, { LAMP: 1 }, 'Stays on after START is released', 'Add a branch (\u2442) under START and put a contact tagged LAMP in it, so the lamp feeds itself.'), win(6, 8.8, { LAMP: 0 }, 'STOP turns it off', 'Add a Normally Closed contact tagged STOP.'), win(10, 11.8, { LAMP: 1 }, 'START latches it on again'),
      win(12.4, 14, { LAMP: 0 }, 'STOP wins when both are pressed', 'STOP must cut power on every path. If the NC STOP contact sits inside one branch row, the other row still holds the lamp on. Put it after the branch block, to the right of both rows.')] }],
  solution: SOL.t5 },

{ id: 't6', group: 'Tutorial', label: 'Level 6', title: 'Latch and unlatch coils', kind: 'bench', noBranch: true, noOutBranch: true, concept: CONCEPT.t6,
  brief: 'The same memory as Level 5, but built from two special coils instead of wiring the output back to itself. Branches are switched off in this level on purpose.',
  goal: 'START latches the LAMP on. STOP unlatches it. If both are pressed together, STOP must win.',
  inputs: [I.START, I.STOP], outputs: [{ tag: 'LAMP', label: 'Lamp', color: 'yellow' }], bits: [], timers: 0, palette: ['NO', 'NC', 'OTL', 'OTU'],
  coach: [
    { text: 'Rung 1: START contact \u2192 <b>Latch coil</b> (OTL) on LAMP.', done: p => hasTag(p, 'NO', 'START') && hasTag(p, 'OTL', 'LAMP') },
    { text: 'Press <b>+ Rung</b>. Rung 2: STOP contact \u2192 <b>Unlatch coil</b> (OTU) on LAMP.', done: p => hasTag(p, 'NO', 'STOP') && hasTag(p, 'OTU', 'LAMP') },
    { text: 'Keep the unlatch rung <b>below</b> the latch rung. The lower rung runs last, so it wins.', done: p => { const a = p.findIndex(r => r.out && r.out.t === 'OTL'), b = p.findIndex(r => r.out && r.out.t === 'OTU'); return a >= 0 && b > a; } }],
  hints: ['A latch coil needs no feedback contact. It simply stays on.', 'The OTU rung must come after the OTL rung. Use the arrow buttons to reorder rungs.'],
  scenarios: [{ name: 'Latch, unlatch, latch again', desc: 'START at 1 s, STOP at 5 s, START at 9 s, then START and STOP together at 12 s', duration: 15,
    events: [].concat(press('START', 1, 0.5), press('STOP', 5, 0.5), press('START', 9, 0.5), hold('START', 12, 14), hold('STOP', 12, 14)),
    checks: [win(0.2, 0.9, { LAMP: 0 }, 'Off at power-up'), win(2, 4.8, { LAMP: 1 }, 'Stays on after START is released', 'Rung: START contact feeding an OTL coil on LAMP.'), win(6, 8.8, { LAMP: 0 }, 'STOP turns it off', 'Rung: STOP contact feeding an OTU coil on LAMP.'), win(10, 11.8, { LAMP: 1 }, 'START latches it on again'),
      win(12.4, 14, { LAMP: 0 }, 'STOP wins when both are pressed', 'When both rungs have power in the same scan, the rung lower in the ladder runs last and wins. Put the OTU rung below the OTL rung.')] }],
  solution: SOL.t6 },

{ id: 't7', group: 'Tutorial', label: 'Level 7', title: 'Several outputs from one rung', kind: 'bench', startFrom: 't1', noBranch: true, concept: CONCEPT.t7,
  brief: 'Machines often need more than one thing to happen at once: a lamp and a horn, a motor and its indicator. Your START to LAMP rung is here again.',
  goal: 'START turns on the LAMP and the HORN together, using <b>one rung</b>.',

    { text: 'Hold START on the bench. Both outputs get the same power.', done: (p, live) => !!(live && live.tags.LAMP && live.tags.HORN) }],

  structure: [{ label: 'One rung drives both outputs', test: p => { const used = p.filter(r => r.rows.some(w => w.length) || r.tail.length || r.out); return used.length === 1 && allOuts(used[0]).length === 2; }, why: 'Two outputs on two separate rungs is not what this level is about.', hint: 'Delete the extra rung and use \u2442 Output on the first rung instead.' }],

{ id: 't8', group: 'Tutorial', label: 'Level 8', title: 'Timers', kind: 'bench', noBranch: true, noOutBranch: true, concept: CONCEPT.t8,
  brief: 'A <b>TON</b> (timer on-delay) counts while its rung has power. When the count reaches the preset, its <b>.DN</b> (done) bit turns on. If power is lost the timer resets to zero. Click a timer and set its preset in seconds.',
  goal: 'Flip the RUN switch on. The BEACON lights 3 seconds later. Switching RUN off turns it off at once and resets the delay.',

  coach: [
    { text: 'Rung 1: RUN contact \u2192 <b>Timer</b> T1 with a 3.0 s preset.', done: p => p.some(r => allOuts(r).some(o => o.t === 'TON' && o.preset === 30)) },
    { text: 'Rung 2: a contact on <b>T1.DN</b> \u2192 BEACON coil.', done: p => hasTag(p, 'NO', 'T1.DN') && hasTag(p, 'COIL', 'BEACON') },
    { text: 'Flip RUN on and watch the timer count on the bench.', done: (p, live) => !!(live && live.timers.T1 && live.timers.T1.acc > 0) }],
  hints: ['The timer is an output. The beacon is a separate rung that reads T1.DN.'],
  scenarios: [{ name: 'Delay, then reset', desc: 'RUN on 1\u20138 s, a 1 s blip at 11\u201312 s, then on from 14 s', duration: 20,
    events: [].concat(hold('RUN', 1, 8), hold('RUN', 11, 12), [{ t: 14, tag: 'RUN', v: true }]),
    checks: [win(0.2, 3.8, { BEACON: 0 }, 'Off before the delay ends'), win(4.3, 7.9, { BEACON: 1 }, 'On 3 s after RUN'), win(8.2, 10.9, { BEACON: 0 }, 'Off when RUN is switched off'),
      win(11.2, 16.8, { BEACON: 0 }, 'A short blip does not light it, and the delay restarts', 'A timer only resets when its rung loses power, so the RUN contact must feed the timer rung directly.'), win(17.4, 20, { BEACON: 1 }, 'On again 3 s after the second RUN')] }],
  solution: SOL.t8 },

{ id: 'r2', group: 'Round', label: 'Level 9', title: 'Blinking red', kind: 'traffic', concept: CONCEPT.r2, startFrom: null,
  brief: 'A four-way intersection with no power to the other lamps yet. Real signals flash red when they fault, so start there. Rather than chaining timers, run <b>one timer</b> that restarts itself and read its <b>running value</b> with a compare contact. One timer can then drive every phase of a signal.',

  solution: SOL.r2 },

  brief: 'Pedestrians cross the main street while the cross street has the green. They press a button, and the PLC must <b>remember</b> the press until it can serve it. WALK shows for the first 4 s of the cross green. Otherwise DON\u2019T WALK stays lit. A latch coil remembers the press, and an unlatch coil forgets it.',

  hints: ['Rung: PED_BTN contact \u2192 OTL on PED_REQ. A press is remembered forever.', 'Rung: LIM T1 15.0 to 15.2 s \u2192 OTU on PED_REQ. It forgets the request just as the walk window closes.', 'WALK = PED_REQ and LIM T1 11.0 to 15.0 s. DON\u2019T WALK = NOT WALK.', 'A seal-in branch (Tutorial 2) works too.'],

    { name: 'Nobody presses', desc: 'No presses, 22 s', duration: 22, checks: [].concat(mainWin(0, 20), crossWin(0, 20), [win(M, 22 - M, { WALK: 0, DONT: 1 }, 'WALK never shows, DON\u2019T WALK always does'), noConflict]) },

        win(17.3, 50.4, { WALK: 0, DONT: 1 }, 'One press serves one crossing only. The request is cleared.'), win(51.6, 54.6, { WALK: 1, DONT: 0 }, 'A later press is served at the next cross green'), walkOnlyGreen, oneWalk, noConflict, oneMain, oneCross] }],
  solution: SOL.r6 },

  hints: ['Set T1 to 27 s. The existing main red and cross red rungs already cover the arrow time.', 'ARROW_G = LIM T1 20 to 24. ARROW_Y = LIM T1 24 to 26. ARROW_R = LES 20, or GEQ 26 (two contacts in parallel).'],

    { name: 'Emergency during main green', desc: 'EMG on from 3 s to 15 s', duration: 30, events: hold('EMG', 3, 15),
      checks: [win(M, 2.6, { M_G: 1, STROBE: 0 }, 'Normal operation before the call'), win(3.4, 14.7, { M_G: 1, M_R: 0, M_Y: 0, C_R: 1, C_G: 0, C_Y: 0, ARROW_R: 1 }, 'Main stays green and everything else stays red for the whole call'), blinks('STROBE', 3.4, 14.7, 12, 'Strobe flashes during the call'),
        win(15.6, 22.4, { STROBE: 0, M_G: 1 }, 'After EMG drops the strobe is off and the cycle restarts at main green'), noConflict, oneMain, oneCross, oneArrow] },
    { name: 'Emergency during cross green', desc: 'Pedestrian waiting, EMG on from 13 s to 24 s', duration: 36, events: [].concat(press('PED_BTN', 2, 0.5), hold('EMG', 13, 24)),

  const dt = Math.min(0.1, (ts - (frame.last || ts)) / 1000); frame.last = ts;
  if (playing) { accT += dt * speed; let n = 0; while (accT >= TICK && n < 40) { accT -= TICK; stepSim(); n++; } }
  Scene.draw($('#scene'), sim.tags, level, sim.timers);
  paintLive(); updateTagList(); drawScope();
  $('#clock').textContent = (sim.tick * TICK).toFixed(1) + ' s';
  if ((frame.n = (frame.n || 0) + 1) % 8 === 0) updateCoach(false);
  requestAnimationFrame(frame);
}

/* ---------- mission card, coach, results ---------- */
function conceptHTML(L, big) {
  const c = L.concept; if (!c) return '';
  return `<div class="concept${c.recap ? ' recap' : ''}"><small>${c.recap ? 'Concept in use' : 'Concept'}</small><h4>${esc(c.title)}</h4><p>${c.body}</p><div class="formula">${esc(c.expr)}</div>${miniLadder(c.example)}</div>`;
}
function renderMission() {
  const i = LEVELS.indexOf(level), prev = level.startFrom ? LEVELS.find(l => l.id === level.startFrom) : null;
  let h = `<div class="kicker">${level.label} \u00B7 Step ${i + 1} of ${LEVELS.length}</div><h3>${esc(level.title)}</h3><p>${level.brief}</p>`;
  h += conceptHTML(level);
  h += `<div class="goal"><small>Goal</small>${level.goal}</div>`;
  if (level.newParts && !level.concept) h += `<div class="newparts"><small>New parts unlocked</small><ul>${level.newParts.map(p => `<li>${esc(p.text)}</li>`).join('')}</ul></div>`;
  if (level.coach) h += `<ul class="coach" id="coach">${level.coach.map((c, k) => `<li data-c="${k}"><i></i><span>${c.text}</span></li>`).join('')}</ul>`;
  if (prev) h += `<p class="stale" style="margin:10px 0 0">Your ladder from ${esc(prev.label)} carries over. Extend it.</p>`;
  h += `<details class="hints"><summary>Need a hint?</summary><ul>${level.hints.map(x => `<li>${x}</li>`).join('')}</ul></details>`;
  const learned = LEVELS.slice(0, i).filter(l => l.concept && !l.concept.recap);
  if (learned.length) h += `<details class="hints learned"><summary>Concepts so far (${learned.length})</summary>${learned.map(l => `<div class="lc"><b>${esc(l.concept.title)}</b><span class="formula">${esc(l.concept.expr)}</span>${miniLadder(l.concept.example)}<p>${l.concept.body}</p></div>`).join('')}</details>`;
  $('#cMission').innerHTML = h;
}
function updateCoach(force) {
  if (!level.coach) return;
  document.querySelectorAll('#coach li').forEach((li, k) => {
    const d = !!level.coach[k].done(prog.rungs, sim); setCls(li, 'done', d); const m = li.firstElementChild; if (m.textContent !== (d ? '✓' : '')) m.textContent = d ? '✓' : '';
  });
}
function renderResults() {
  const R = $('#cRes'), idx = LEVELS.indexOf(level), next = LEVELS[idx + 1];
  let h = `<div class="resHead"><h2>Check your logic</h2><button class="btn primary" id="bCheck">Run the tests</button></div>`;
  if (!results) h += `<p class="stale" style="margin:0">The tests replay the controller with scripted button presses and check every lamp against the goal. Your ladder must pass every check.</p>`;
  else {
    const all = results.every(r => r.ok);
    if (all) h += `<div class="banner"><div class="sp"><b>${done[level.id] ? 'Level complete' : 'All checks passed'}</b><br><span class="stale">${prog.rungs.length} rung${prog.rungs.length === 1 ? '' : 's'} used (reference: ${level.solution.length}).</span></div>${next ? `<button class="btn primary" id="bNext">Next: ${esc(next.title)} →</button>` : '<b>You built a full traffic controller.</b>'}</div>`;
    if (stale) h += `<div class="stale">You changed the ladder after this run. Run the tests again.</div>`;
    h += results.map(r => `<div class="sc ${r.ok ? 'pass' : ''}"><h4>${r.ok ? '<span style="color:var(--ok)">✓</span>' : '<span style="color:var(--bad)">✗</span>'} ${esc(r.name)}</h4><p>${esc(r.desc || '')}</p><ul>${r.checks.map(c => `<li class="${c.ok ? 'ok' : 'no'}"><b>${c.ok ? '✓' : '✗'}</b><span>${esc(c.label)}${c.ok ? '' : `<span class="why">${esc(c.msg)}</span>${c.hint ? `<span class="tip"><b>Hint:</b> ${esc(c.hint)}</span>` : ''}`}</span></li>`).join('')}</ul></div>`).join('');
  }
  h += `<div class="sol">${solConfirm ? 'Replace your ladder with the reference solution? <button class="btn sm" id="bSolYes">Yes, replace</button><button class="btn sm" id="bSolNo">Cancel</button>' : 'Stuck? <button class="linkbtn" id="bSol">Load the reference solution</button> (you can undo it)'}</div>`;
    R.innerHTML = h;
  $('#bCheck').onclick = runChecks;
  const nx = $('#bNext'); if (nx) nx.onclick = () => openLevel(next.id);
  const s1 = $('#bSol'); if (s1) s1.onclick = () => { solConfirm = true; renderResults(); };
  const s2 = $('#bSolNo'); if (s2) s2.onclick = () => { solConfirm = false; renderResults(); };
  const s3 = $('#bSolYes'); if (s3) s3.onclick = () => { mutate(() => { prog.rungs = clone(level.solution); sel = null; }); };
}
function runChecks() {
  results = gradeLevel(prog, level); stale = false;
  if (results.every(r => r.ok)) { done[level.id] = true; LS.set('rbr3.done', JSON.stringify(done)); renderNav(); }
  renderResults(); $('#cRes').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function renderNav() {
  $('#levels').innerHTML = LEVELS.map(l => `<button class="chip${done[l.id] ? ' done' : ''}" data-id="${l.id}" ${l.id === level.id ? 'aria-current="true"' : ''}><span class="tick">${done[l.id] ? '✓' : ''}</span>${esc(l.label)}</button>`).join('');
  const cur = $('#levels [aria-current]'); if (cur && cur.scrollIntoView) { const L = $('#levels'); L.scrollLeft = cur.offsetLeft - 40; }
}
function renderLegend() {
  const d = { NO: 'Normally open. Passes power when its tag is ON.', NC: 'Normally closed. Passes power when its tag is OFF.', COIL: 'Output coil. Its tag is ON while it has power.', TON: 'On-delay timer. Its .DN bit turns on after the preset.', LES: 'Passes power while the timer\u2019s running value is below a number.', GEQ: 'Passes power once the timer\u2019s running value reaches a number.', LIM: 'Passes power while the timer\u2019s value is inside a window.', OTL: 'Latch coil. Turns its tag ON and keeps it on.', OTU: 'Unlatch coil. Turns its tag OFF.' };
  const fresh = (level.newParts || []).map(p => p.id);
  $('#legend').innerHTML = level.palette.map(t => `<div${fresh.includes(t) ? ' class="isnew"' : ''}>${SYM[t]}<span>${d[t]}</span></div>`).join('');
}

/* ---------- level loading ---------- */
function openLevel(id, fromHash) {
  closeMenu();
  level = LEVELS.find(l => l.id === id) || LEVELS[0];
  LABEL = {}; level.outputs.concat(level.inputs, level.bitsInfo || [], (level.clocks || []).map(c => CLOCKS[c])).forEach(o => LABEL[o.tag] = o.label); TAGNAME = LABEL;
  let saved = null; try { saved = JSON.parse(LS.get('rbr3.prog.' + level.id)); } catch (e) { }
  if (!saved || !Array.isArray(saved) || !saved.length) {
    if (level.startFrom) { try { saved = JSON.parse(LS.get('rbr3.prog.' + level.startFrom)); } catch (e) { } if (!saved || !saved.length) saved = clone(SOL[level.startFrom]); }
    else saved = [emptyRung()];
  }
  prog = { rungs: saved }; normalize();
  sel = null; undoStack = []; results = null; stale = false; solConfirm = false; inputs = {};
  scopeKeys = level.inputs.map(i => i.tag).concat(level.outputs.map(o => o.tag));
  Scene.reset(); rebuildSim();
  LS.set('rbr3.last', level.id);
  if (!fromHash) { try { history.replaceState(null, '', '#' + level.id); } catch (e) { } }
  renderNav(); renderMission(); renderLegend(); renderInputs(); renderLadder(); renderInsp(); renderTagList(); renderResults(); updateCoach(true);
  window.scrollTo({ top: 0 });
}
function boot() {
  wireEditor();
  $('#levels').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) openLevel(b.dataset.id); });
  $('#bPlay').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
  $('#bReset').onclick = () => { Scene.reset(); rebuildSim(); };
  document.querySelectorAll('.speed button').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  addEventListener('hashchange', () => { showView(); const id = location.hash.slice(1); if (LEVELS.some(l => l.id === id) && id !== level.id) openLevel(id, true); });
  const h = location.hash.slice(1), last = LS.get('rbr3.last');
  openLevel(LEVELS.some(l => l.id === h) ? h : LEVELS.some(l => l.id === last) ? last : 't1', true);
  showView(); requestAnimationFrame(frame);
}
boot();

/* ---------- text export and reviewer sheet ---------- */
function ladderText(rungs) {
  const f = x => (x / 10).toFixed(1) + 's';
  const el = e => e.t === 'NO' ? `XIC ${e.tag || '?'}` : e.t === 'NC' ? `XIO ${e.tag || '?'}` : e.t === 'COIL' ? `OTE ${e.tag || '?'}` : e.t === 'OTL' ? `OTL ${e.tag || '?'}` : e.t === 'OTU' ? `OTU ${e.tag || '?'}` : e.t === 'LES' ? `LES ${e.tag}.ACC < ${f(e.val)}` : e.t === 'GEQ' ? `GEQ ${e.tag}.ACC >= ${f(e.val)}` : e.t === 'LIM' ? `LIM ${f(e.lo)} <= ${e.tag}.ACC < ${f(e.hi)}` : `TON ${e.tag || '?'} preset ${f(e.preset)}`;
  return rungs.map((r, i) => {
    const rows = r.rows.filter(x => x.length).map(x => x.map(el).join('  ->  '));
    let t = `Rung ${i + 1}:  `;
    if (rows.length > 1) t += '[ ' + rows.map(x => '( ' + x + ' )').join('  OR  ') + ' ]'; else t += rows[0] || '(always on)';
    if (r.tail.length) t += '  ->  ' + r.tail.map(el).join('  ->  ');
    const os = allOuts(r);
    return t + '  ->  ' + (os.length > 1 ? '{ ' + os.map(el).join('  ,  ') + ' }' : os.length ? el(os[0]) : '(no output)');
  }).join('\n');
}
function shareText() {
  const sc = level.scenarios.map(s => `  - ${s.name}: ${s.desc || ''}`).join('\n');
  return `Rung by Rung: ${level.label}, ${level.title}\nGoal: ${level.goal.replace(/<[^>]+>/g, '')}\nTests:\n${sc}\n\nMy ladder (XIC = normally open, XIO = normally closed, OTE = coil, OTL/OTU = latch/unlatch, TON = on-delay timer, LES/GEQ/LIM = compare a timer\u2019s accumulator):\n${ladderText(prog.rungs)}\n\nLast result: ${results ? (results.every(r => r.ok) ? 'all checks pass' : results.flatMap(r => r.checks.filter(c => !c.ok).map(c => `${r.name} / ${c.label}: ${c.msg}`)).join('\n  ')) : 'tests not run yet'}`;
}
function renderShare() {
  const box = $('#shareBox'); if (!box) return;
  box.innerHTML = `<details class="share"><summary>Share this ladder with an expert</summary><p class="stale">Copy this text into an email or chat. It has the goal, the tests and your ladder in standard mnemonics. For the whole course, send them the page link with <b>#review</b> on the end.</p><textarea readonly id="shareTxt" aria-label="Ladder as text"></textarea><div style="margin-top:6px"><button class="btn sm" id="bCopy">Copy text</button> <span class="stale" id="copyMsg"></span></div></details>`;
  const d = box.querySelector('details'), ta = $('#shareTxt'); d.addEventListener('toggle', () => { ta.value = shareText(); });
  $('#bCopy').onclick = () => { ta.value = shareText(); ta.select(); let ok = false; try { navigator.clipboard.writeText(ta.value).then(() => { $('#copyMsg').textContent = 'Copied.'; }, () => { $('#copyMsg').textContent = 'Select the text and copy it.'; }); ok = true; } catch (e) { } if (!ok) $('#copyMsg').textContent = 'Select the text and copy it.'; };
}
function renderReview() {
  const strip = h => h.replace(/<[^>]+>/g, '');
  let h = `<div class="rev"><div class="card"><h3>Reviewer sheet</h3><p>For anyone checking the course for technical accuracy. Every round lists its goal, its tests and the reference solution in standard ladder mnemonics. <a href="#t1" id="backGame">Back to the game</a></p>
  <h5>How the simulator works</h5><ul><li>Scan cycle of 100 ms. Rungs run top to bottom, and a coil or timer written in a rung is visible to later rungs in the same scan.</li><li>Inputs are applied at the start of each scan. Outputs are just tags the ladder writes.</li><li>TON: accumulates one tick per scan while its rung is true, sets .DN when it reaches the preset, and resets to zero and clears .DN when the rung goes false.</li><li>A rung is a group of parallel rows (OR), each row a series of contacts (AND), then optional series contacts, then one output. A rung with no contacts is always true.</li><li>Simplifications: the STOP button reads true when pressed and is examined with an NC contact (real stop buttons are usually wired the other way for fail-safety). No retentive timers, counters or one-shots. System clock bits CLK_1HZ and CLK_FAST are provided by the sim.</li><li>A tested window starts and ends 0.3 to 0.4 s inside each phase, so one or two scans of timing drift are accepted.</li></ul></div>`;
  LEVELS.forEach(L => {
    h += `<div class="card"><div class="kicker">${esc(L.label)}</div><h3>${esc(L.title)}</h3><p>${strip(L.brief)}</p><div class="goal"><small>Goal</small>${strip(L.goal)}</div>
    <h5>Tags</h5><p class="stale">Inputs: ${L.inputs.map(i => `${i.tag} (${i.kind === 'push' ? 'momentary' : 'maintained'})`).join(', ') || 'none'}<br>Outputs: ${L.outputs.map(o => o.tag).join(', ')}${L.bits.length ? '<br>Memory bits: ' + L.bits.join(', ') : ''}</p>
    <h5>Tests</h5>` + L.scenarios.map(s => `<p style="margin:4px 0"><b>${esc(s.name)}</b> <span class="stale">${esc(s.desc || '')}</span></p><ul>${s.checks.map(c => `<li>${esc(c.label)}</li>`).join('')}</ul>`).join('') +
    `<h5>Reference solution (${L.solution.length} rung${L.solution.length === 1 ? '' : 's'})</h5><pre>${esc(ladderText(L.solution))}</pre></div>`;
  });
  $('#reviewView').innerHTML = h + '</div>';
}
function showView() {
  const rv = location.hash.slice(1) === 'review';
  $('#reviewView').hidden = !rv; $('.layout').hidden = rv; $('#levels').hidden = rv;
  if (rv) { renderReview(); window.scrollTo({ top: 0 }); }
}
</script>

</body></html>
